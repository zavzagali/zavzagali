name: Update GitHub Stats

on:
  push:
    branches:
      - master
    paths-ignore:
      - "assets/**"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [update-stats]

jobs:
  update-cards:
    if: github.actor != 'github-actions[bot]'
    concurrency:
      group: stats
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install @octokit/rest

      - name: Run Stats Generator
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node generate-stats.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/profile-stats.svg assets/lang-diff.svg assets/issues-prs.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update github stats svgs" && git push)